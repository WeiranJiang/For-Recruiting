# Security gate. Make these jobs "required" in GitHub branch protection for `main`,
# and enable Vercel Deployment Checks so production only deploys when they pass.
name: security

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 6 * * 1" # weekly: catch newly published advisories

permissions:
  contents: read

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: lint · typecheck · unit tests · build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci --ignore-scripts
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: "1"

  dependencies:
    name: dependency audit (blocks on high/critical in production deps)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm ci --ignore-scripts
      - name: Production dependencies (gate)
        run: npm run security:audit
      - name: All dependencies (informational; dev-tool advisories are tracked in SECURITY_REMEDIATION.md)
        run: npm audit || true

  secrets:
    name: secret scanning (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  smoke:
    name: security smoke tests (authz, IDOR, CSRF, headers, quotas)
    runs-on: ubuntu-latest
    needs: checks
    env:
      DEV_LOGIN: "1"
      AI_DAILY_LIMIT: "3"
      CRON_SECRET: ci-only-cron-secret-0123456789abcdef
      SESSION_SECRET: ci-only-session-secret-0123456789abcdef0123456789
      DATABASE_URL: pglite:./.data/ci
      APP_URL: http://localhost:3100
      BASE: http://localhost:3100
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci --ignore-scripts
      - name: Start dev server (test-only settings, no real credentials)
        run: npx next dev -p 3100 > server.log 2>&1 &
      - run: npm run security:smoke
      - if: failure()
        run: tail -200 server.log
